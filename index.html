<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mutfak Defteri" />
<meta name="theme-color" content="#FAF6EE" />
<title>Ev Mutfağı Defteri</title>
<style>
  :root{
    --ink:#2A241E;
    --paper:#FAF6EE;
    --tomato:#B23A2E;
    --basil:#46693B;
    --mustard:#8A6A1F;
    --mustard-bg:#F1E8D8;
    --line:#DCD0BC;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px;}

  /* header */
  .header{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .header .icon{
    background:var(--ink);color:var(--paper);
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;
  }
  .header h1{font-size:18px;font-weight:700;margin:0;line-height:1.2;}
  .header p{font-size:12px;opacity:.7;margin:2px 0 0;}

  /* receipt card */
  .receipt{
    position:relative;background:var(--white);
    border:1px solid var(--line);border-radius:2px;
    box-shadow:0 2px 10px rgba(42,36,30,0.08);
    margin-bottom:24px;
  }
  .perf-top, .perf-bottom{
    height:10px;
    background-image:radial-gradient(circle at 6px 0px, var(--paper) 5px, transparent 5.5px);
    background-size:12px 10px;background-repeat:repeat-x;
  }
  .perf-top{margin-top:-1px;}
  .perf-bottom{
    background-image:radial-gradient(circle at 6px 10px, var(--paper) 5px, transparent 5.5px);
    margin-bottom:-1px;
  }
  .receipt-body{padding:8px 20px 16px;}
  .tabs-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .toggle button{
    border:none;background:transparent;font-size:12px;font-weight:600;
    padding:6px 12px;cursor:pointer;color:var(--ink);font-family:inherit;
  }
  .toggle button.active{background:var(--ink);color:var(--paper);}
  select.month-select{
    font-size:12px;font-weight:600;background:transparent;border:none;
    color:var(--ink);font-family:inherit;
  }
  .row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:6px 0;border-bottom:1px dashed var(--line);
  }
  .row .label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;opacity:.7;display:flex;align-items:center;gap:5px;}
  .row .amount{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600;}
  .row.net{border-bottom:none;padding-top:12px;margin-top:4px;}
  .row.net .label{font-size:11px;font-weight:700;opacity:1;}
  .row.net .amount{font-size:22px;font-weight:700;}
  .up{color:var(--basil);}
  .down{color:var(--tomato);}

  /* form card */
  .form-card{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:16px;margin-bottom:24px;
  }
  .type-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px;}
  .type-toggle button{
    flex:1;padding:10px 6px;font-size:14px;font-weight:600;border:none;cursor:pointer;
    background:transparent;color:var(--ink);font-family:inherit;
  }
  .type-toggle button.active-gelir{background:var(--basil);color:#fff;}
  .type-toggle button.active-gider{background:var(--tomato);color:#fff;}
  .field{
    width:100%;font-size:14px;padding:10px 12px;border-radius:8px;
    border:1px solid var(--line);outline:none;font-family:inherit;
    margin-bottom:8px;background:var(--white);color:var(--ink);
  }
  .field:focus{border-color:var(--ink);}
  .amount-row{display:flex;gap:8px;}
  .amount-row .field{margin-bottom:0;}
  #tutarInput{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .add-btn{
    padding:10px 18px;border-radius:8px;border:none;color:#fff;
    font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;
  }

  /* list */
  .list-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.7;margin:0 4px 8px;}
  .empty{text-align:center;padding:40px 0;font-size:14px;opacity:.6;}
  .item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:6px;
  }
  .item .meta{min-width:0;flex:1;}
  .item .top-line{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
  .item .date{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;opacity:.6;}
  .item .cat{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--mustard-bg);color:var(--mustard);white-space:nowrap;}
  .item .desc{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item .right{display:flex;align-items:center;gap:10px;padding-left:8px;flex-shrink:0;}
  .item .val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:600;white-space:nowrap;}
  .del-btn{
    border:none;background:transparent;cursor:pointer;opacity:.4;font-size:16px;
    padding:2px;line-height:1;color:var(--ink);
  }
  .del-btn:active{opacity:1;}

  .footer-note{font-size:11px;text-align:center;opacity:.5;margin-top:24px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="icon">🍳</div>
    <div>
      <h1>Ev Mutfağı Defteri</h1>
      <p>Gelir · Gider · Kâr takibi</p>
    </div>
  </div>

  <!-- ÖZET FİŞ -->
  <div class="receipt">
    <div class="perf-top"></div>
    <div class="receipt-body">
      <div class="tabs-row">
        <div class="toggle">
          <button id="btnAy" class="active">Bu Ay</button>
          <button id="btnTum">Tüm Zamanlar</button>
        </div>
        <select id="monthSelect" class="month-select"></select>
      </div>

      <div class="row">
        <span class="label up">↗ Gelir</span>
        <span class="amount up" id="toplamGelir">0,00 ₺</span>
      </div>
      <div class="row">
        <span class="label down">↘ Gider</span>
        <span class="amount down" id="toplamGider">0,00 ₺</span>
      </div>
      <div class="row net">
        <span class="label">Net Kâr</span>
        <span class="amount" id="toplamNet">+0,00 ₺</span>
      </div>
    </div>
    <div class="perf-bottom"></div>
  </div>

  <!-- FORM -->
  <div class="form-card">
    <div class="type-toggle">
      <button id="tipGelir" class="active-gelir">↗ Gelir Ekle</button>
      <button id="tipGider">↘ Gider Ekle</button>
    </div>

    <input type="date" id="tarihInput" class="field" />
    <input type="text" id="aciklamaInput" class="field" placeholder="Ne sattın? (örn: 3 kg mantı - Ayşe Hanım)" />
    <select id="kategoriInput" class="field" style="display:none;">
      <option>Malzeme / Hammadde</option>
      <option>Ambalaj</option>
      <option>Kira / Fatura</option>
      <option>Ulaşım / Kargo</option>
      <option>Ekipman</option>
      <option>Reklam / Pazarlama</option>
      <option>Diğer</option>
    </select>
    <div class="amount-row">
      <input type="number" inputmode="decimal" id="tutarInput" class="field" placeholder="Tutar (₺)" />
      <button id="ekleBtn" class="add-btn" style="background:var(--basil);">+ Ekle</button>
    </div>
  </div>

  <!-- LİSTE -->
  <div>
    <p class="list-title" id="listTitle">HAREKETLER (0)</p>
    <div id="listContainer"></div>
  </div>

  <p class="footer-note">Veriler bu cihazda, bu tarayıcıda saklanır.</p>
</div>

<script>
(function(){
  var STORAGE_KEY = "ev-mutfagi-defteri-kayitlar";
  var AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

  var kayitlar = [];
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    kayitlar = raw ? JSON.parse(raw) : [];
  }catch(e){ kayitlar = []; }

  var state = {
    tip: "gelir",
    gorunum: "ay",
    secilenAy: todayISO().slice(0,7)
  };

  function todayISO(){
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0,10);
  }

  function tl(n){
    return new Intl.NumberFormat("tr-TR", {minimumFractionDigits:2, maximumFractionDigits:2}).format(n);
  }

  function monthKey(dateStr){ return dateStr.slice(0,7); }
  function monthLabel(key){
    var parts = key.split("-");
    return AYLAR[parseInt(parts[1],10)-1] + " " + parts[0];
  }

  function kaydet(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(kayitlar)); }
    catch(e){ /* sessiz geç */ }
  }

  // ---- DOM referansları ----
  var btnAy = document.getElementById("btnAy");
  var btnTum = document.getElementById("btnTum");
  var monthSelect = document.getElementById("monthSelect");
  var toplamGelirEl = document.getElementById("toplamGelir");
  var toplamGiderEl = document.getElementById("toplamGider");
  var toplamNetEl = document.getElementById("toplamNet");

  var tipGelirBtn = document.getElementById("tipGelir");
  var tipGiderBtn = document.getElementById("tipGider");
  var tarihInput = document.getElementById("tarihInput");
  var aciklamaInput = document.getElementById("aciklamaInput");
  var kategoriInput = document.getElementById("kategoriInput");
  var tutarInput = document.getElementById("tutarInput");
  var ekleBtn = document.getElementById("ekleBtn");

  var listTitle = document.getElementById("listTitle");
  var listContainer = document.getElementById("listContainer");

  tarihInput.value = todayISO();

  // ---- Görünüm toggle ----
  btnAy.addEventListener("click", function(){
    state.gorunum = "ay";
    btnAy.classList.add("active");
    btnTum.classList.remove("active");
    monthSelect.style.display = "";
    render();
  });
  btnTum.addEventListener("click", function(){
    state.gorunum = "tum";
    btnTum.classList.add("active");
    btnAy.classList.remove("active");
    monthSelect.style.display = "none";
    render();
  });
  monthSelect.addEventListener("change", function(){
    state.secilenAy = monthSelect.value;
    render();
  });

  // ---- Tip toggle ----
  tipGelirBtn.addEventListener("click", function(){
    state.tip = "gelir";
    tipGelirBtn.classList.add("active-gelir");
    tipGiderBtn.classList.remove("active-gider");
    kategoriInput.style.display = "none";
    aciklamaInput.placeholder = "Ne sattın? (örn: 3 kg mantı - Ayşe Hanım)";
    ekleBtn.style.background = "var(--basil)";
  });
  tipGiderBtn.addEventListener("click", function(){
    state.tip = "gider";
    tipGiderBtn.classList.add("active-gider");
    tipGelirBtn.classList.remove("active-gelir");
    kategoriInput.style.display = "";
    aciklamaInput.placeholder = "Ne için harcadın? (örn: un, yağ)";
    ekleBtn.style.background = "var(--tomato)";
  });

  // ---- Ekle ----
  ekleBtn.addEventListener("click", function(){
    var tarih = tarihInput.value;
    var aciklama = aciklamaInput.value.trim();
    var sayi = parseFloat(String(tutarInput.value).replace(",", "."));

    if(!tarih || !aciklama || !sayi || sayi <= 0){
      return;
    }

    kayitlar.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      tip: state.tip,
      tarih: tarih,
      aciklama: aciklama,
      kategori: state.tip === "gider" ? kategoriInput.value : null,
      tutar: sayi
    });
    kayitlar.sort(function(a,b){ return a.tarih.localeCompare(b.tarih); });
    kaydet();

    aciklamaInput.value = "";
    tutarInput.value = "";
    render();
  });

  function silKayit(id){
    kayitlar = kayitlar.filter(function(k){ return k.id !== id; });
    kaydet();
    render();
  }

  // ---- Render ----
  function render(){
    // ay listesini güncelle
    var aySet = {};
    kayitlar.forEach(function(k){ aySet[monthKey(k.tarih)] = true; });
    aySet[todayISO().slice(0,7)] = true;
    var ayListesi = Object.keys(aySet).sort().reverse();

    if(!aySet[state.secilenAy]) state.secilenAy = ayListesi[0];

    monthSelect.innerHTML = "";
    ayListesi.forEach(function(ay){
      var opt = document.createElement("option");
      opt.value = ay;
      opt.textContent = monthLabel(ay);
      if(ay === state.secilenAy) opt.selected = true;
      monthSelect.appendChild(opt);
    });

    var gosterilecek = state.gorunum === "ay"
      ? kayitlar.filter(function(k){ return monthKey(k.tarih) === state.secilenAy; })
      : kayitlar.slice();

    gosterilecek.sort(function(a,b){ return b.tarih.localeCompare(a.tarih); });

    var gelir = 0, gider = 0;
    gosterilecek.forEach(function(k){
      if(k.tip === "gelir") gelir += k.tutar; else gider += k.tutar;
    });
    var net = gelir - gider;

    toplamGelirEl.textContent = tl(gelir) + " ₺";
    toplamGiderEl.textContent = tl(gider) + " ₺";
    toplamNetEl.textContent = (net >= 0 ? "+" : "") + tl(net) + " ₺";
    toplamNetEl.className = "amount " + (net >= 0 ? "up" : "down");

    listTitle.textContent = (state.gorunum === "ay" ? monthLabel(state.secilenAy) + " Hareketleri" : "Tüm Hareketler") + " (" + gosterilecek.length + ")";

    listContainer.innerHTML = "";
    if(gosterilecek.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Henüz kayıt yok. Yukarıdan ilk gelir veya gideri ekle.";
      listContainer.appendChild(empty);
      return;
    }

    gosterilecek.forEach(function(k){
      var item = document.createElement("div");
      item.className = "item";

      var meta = document.createElement("div");
      meta.className = "meta";

      var topLine = document.createElement("div");
      topLine.className = "top-line";
      var dateEl = document.createElement("span");
      dateEl.className = "date";
      dateEl.textContent = k.tarih.slice(8,10) + "." + k.tarih.slice(5,7);
      topLine.appendChild(dateEl);
      if(k.kategori){
        var catEl = document.createElement("span");
        catEl.className = "cat";
        catEl.textContent = k.kategori;
        topLine.appendChild(catEl);
      }
      meta.appendChild(topLine);

      var descEl = document.createElement("p");
      descEl.className = "desc";
      descEl.style.margin = "0";
      descEl.textContent = k.aciklama;
      meta.appendChild(descEl);

      var right = document.createElement("div");
      right.className = "right";
      var valEl = document.createElement("span");
      valEl.className = "val " + (k.tip === "gelir" ? "up" : "down");
      valEl.textContent = (k.tip === "gelir" ? "+" : "-") + tl(k.tutar) + " ₺";
      var delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", function(){ silKayit(k.id); });

      right.appendChild(valEl);
      right.appendChild(delBtn);

      item.appendChild(meta);
      item.appendChild(right);
      listContainer.appendChild(item);
    });
  }

  render();
})();
</script>
</body>
</html>
